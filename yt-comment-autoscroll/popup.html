<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YT Comment Auto-Scroll</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --card: #1c1c1c;
        --fg: #f1f1f1;
        --muted: #aaa;
        --accent: #3ea6ff;
        --stop: #ff5252;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 Roboto, Arial, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
      .dot.on { background: var(--accent); }
      .sub { color: var(--muted); font-size: 11px; margin: 0 0 12px; }
      .status {
        background: var(--card);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .row { display: flex; justify-content: space-between; margin: 3px 0; }
      .row .k { color: var(--muted); }
      .row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
      .msg { color: var(--accent); font-size: 11px; margin-top: 6px; min-height: 14px; }
      .btns { display: flex; gap: 8px; margin-bottom: 12px; }
      button {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        color: #0f0f0f;
        background: var(--accent);
      }
      button.stop { background: var(--stop); color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      details { background: var(--card); border-radius: 10px; padding: 8px 12px; }
      summary { cursor: pointer; color: var(--muted); font-size: 12px; }
      .field { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
      .field label { color: var(--muted); }
      .field input[type="number"] {
        width: 70px; background: #000; color: var(--fg);
        border: 1px solid #333; border-radius: 6px; padding: 4px 6px;
      }
      .field input[type="checkbox"] { width: 16px; height: 16px; }
      .hint { color: var(--muted); font-size: 10px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1><span id="dot" class="dot"></span> Auto-Scroll de comentarios</h1>
    <p class="sub">Carga todos los comentarios (lazy load) de forma humana.</p>

    <div class="status">
      <div class="row"><span class="k">Estado</span><span id="s-state" class="v">—</span></div>
      <div class="row"><span class="k">Comentarios</span><span id="s-total" class="v">0</span></div>
      <div class="row"><span class="k">Ciclos</span><span id="s-cycle" class="v">0</span></div>
      <div class="row"><span class="k">Tiempo</span><span id="s-time" class="v">0s</span></div>
      <div id="s-msg" class="msg"></div>
    </div>

    <div class="btns">
      <button id="btn-start">Iniciar</button>
      <button id="btn-stop" class="stop">Parar</button>
    </div>

    <details>
      <summary>Ajustes</summary>
      <div class="field">
        <label for="baseIntervalMs">Intervalo (ms)</label>
        <input type="number" id="baseIntervalMs" min="1200" step="100" />
      </div>
      <div class="field">
        <label for="jitterMs">Aleatoriedad ±(ms)</label>
        <input type="number" id="jitterMs" min="0" step="100" />
      </div>
      <div class="field">
        <label for="stallCycles">Ciclos sin nuevos p/parar</label>
        <input type="number" id="stallCycles" min="2" step="1" />
      </div>
      <div class="field">
        <label for="expandReplies">Abrir respuestas</label>
        <input type="checkbox" id="expandReplies" />
      </div>
      <div class="field">
        <label for="autoStart">Auto-iniciar en /watch</label>
        <input type="checkbox" id="autoStart" />
      </div>
      <p class="hint">
        Valores mas altos = mas humano y mas seguro frente al bloqueo de YouTube.
        Recomendado: intervalo 3000ms con ±1200ms.
      </p>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
